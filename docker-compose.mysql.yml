services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: code_evolver
      MYSQL_USER: code_evolver
      MYSQL_PASSWORD: ${CODEEVOLVER_MYSQL_PASSWORD:?Set CODEEVOLVER_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${CODEEVOLVER_MYSQL_ROOT_PASSWORD:?Set CODEEVOLVER_MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 15
volumes:
  mysql-data: